# Render Blueprint: one free web service runs the website and the API together.
# In Render: New + -> Blueprint -> pick this repository. Fill in the secrets it asks for.
services:
  - type: web
    name: pak-china-cargo
    runtime: node
    plan: free
    region: singapore # closest Render region to Pakistan
    buildCommand: >-
      npm ci --prefix frontend --include=dev &&
      npm run build --prefix frontend &&
      npm ci --prefix backend --include=dev &&
      npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Asked for when you create the Blueprint (never stored in the code):
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Random secret generated by Render. Changing it signs every admin out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLOUDINARY_FOLDER
        value: pak-china-cargo
      - key: COOKIE_SAMESITE
        value: lax
      # Later, with a real domain: add SITE_URL (e.g. https://pakchinacargo.com) in the Render dashboard.
